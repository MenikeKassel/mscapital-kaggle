[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mscapital"
version = "0.1.0"
description = "Leakage-safe experiment protocol for MSCapital forecasting"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyarrow>=12",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
models = ["catboost>=1.2", "scikit-learn>=1.2"]
dev = ["pytest>=7"]

[project.scripts]
mscapital = "mscapital.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
